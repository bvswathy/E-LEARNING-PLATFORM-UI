<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Learn Login</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #673ab7, #2196f3);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .login-container {
      background: #fff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      text-align: center;
      width: 350px;
    }

    .login-container h1.logo {
      color: #673ab7;
      margin-bottom: 10px;
    }

    .login-container h2 {
      margin-bottom: 20px;
      color: #333;
    }

    .login-form input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
    }

    .login-form input:focus {
      border-color: #2196f3;
      outline: none;
      box-shadow: 0 0 5px rgba(33,150,243,0.5);
    }

    .btn {
      width: 100%;
      background: #2196f3;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .btn:hover {
      background: #1976d2;
    }

    .signup-text {
      margin-top: 15px;
      font-size: 14px;
    }

    .signup-text a {
      color: #673ab7;
      text-decoration: none;
      font-weight: bold;
    }

    .signup-text a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h1 class="logo">E-Learn</h1>
    <h2>Welcome Back</h2>
    <form class="login-form" onsubmit="return loginUser(event)">
      <input type="text" id="username" placeholder="Username" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit" class="btn">Login</button>
    </form>
    <p class="signup-text">Don't have an account? <a href="#">Sign up</a></p>
  </div>

  <script>
    function loginUser(event) {
      event.preventDefault(); // stop form from refreshing page

      // Simple demo: check if fields are filled
      const user = document.getElementById("username").value;
      const pass = document.getElementById("password").value;

      if(user && pass) {
        alert("Login successful! Redirecting...");
        // Redirect to next page (change to your desired page)
        window.location.href = "index.html";
      } else {
        alert("Please enter username and password");
      }
    }
  </script>
</body>
</html>
